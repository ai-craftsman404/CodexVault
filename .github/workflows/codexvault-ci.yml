name: CodexVault CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fixture-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run CodexVault test suite
        run: python -m unittest discover -s plugins/codexvault/tests -p "test_*.py"
