name: CodexVault CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fixture-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run CodexVault fixture harness
        shell: pwsh
        working-directory: plugins/codexvault
        run: ./scripts/tests/Run-CodexVaultFixtureTests.ps1

